syntax = "proto3";
package panoseti.daq_control;

import "google/protobuf/struct.proto";

service DaqControl {
    /* start daq: start hashpipe on daq nodes */
    rpc StartDaq (StartDaqRequest) returns (StartDaqResponse) {}
    /* stop daq: stop hashpipe on daq nodes */
    rpc StopDaq (StopDaqRequest) returns (StopDaqResponse) {}
    /* status daq: get status data from daq nodes */
    rpc StatusDaq (DaqStatusRequest) returns (DaqStatusResponse) {}
    /* CleanupData: Clean up data for the specific run */
    rpc CleanupData (CleanupDataRequest) returns (CleanupDataResponse) {}
    /* GenerateManifest: Generate a checksum manifest for run data */
    rpc GenerateManifest (GenerateManifestRequest) returns (GenerateManifestResponse) {}
    /* GetManifest: Stream manifest entries for a module's run data */
    rpc GetManifest (GetManifestRequest) returns (stream ManifestEntry) {}
}

/* start daq request and response */
message StartDaqRequest {
    string  data_dir = 1;
    /* daq_ip_addr is not necessary */
    /* we just want it to be compatiable with the old code */
    string  daq_ip_addr = 2;
    string  bindhost = 3;
    uint32  max_file_size_mb = 4;
    bool    group_ph_frames = 5;
    string  run_dir = 6;
    string  obs = 7;
    /* each daq node may support more that one telescopes */
    repeated uint32  module_id = 8 [packed=true];
}

message StartDaqResponse {
    bool    success = 1;
    string  message = 2;
}

/* stop daq request and response */
message StopDaqRequest {
    string  data_dir = 1;
    string  run_dir = 2;
}

message StopDaqResponse {
    bool    success = 1;
    string  message = 2;
}

/* status daq request and response */
message DaqStatusRequest {
    string  data_dir = 1;
    bool    check_hashpipe_running = 2;
    bool    check_disk_usage = 3;
    bool    check_run_dirs = 4;
}

message DaqStatusResponse {
    bool    success = 1;
    /* response to check_hashpipe_running */
    bool    hashpipe_running = 2;
    /* response to check_disk_usage */
    google.protobuf.Struct disk_usage = 3;
    /* response to check_run_dir */
    repeated string run_dirs = 4;
    string  message = 5;
}

enum CleanupMode {
    CLEANUP_FULL      = 0;
    CLEANUP_SELECTIVE = 1;
}

/* collect data request and response */
message CleanupDataRequest {
    string  data_dir = 1;
    string  run_dir = 2;
    repeated uint32  module_id = 3 [packed=true];
    bool    force = 4;
    CleanupMode mode = 5;
    repeated string delete_patterns  = 6;
    repeated string preserve_patterns = 7;
}

message CleanupDataResponse {
    bool    success = 1;
    string  message = 2;
    uint32  deleted_count = 3;
    uint64  freed_bytes   = 4;
    repeated string preserved_paths = 5;
}

message GenerateManifestRequest {
    string  data_dir = 1;
    string  run_dir  = 2;
    uint32  module_id = 3;
    string  algorithm = 4;
    repeated string include_patterns = 5;
}

message GenerateManifestResponse {
    bool    success = 1;
    string  message = 2;
    string  manifest_path = 3;
    uint32  file_count = 4;
    uint64  total_bytes = 5;
    double  elapsed_seconds = 6;
    string  algorithm = 7;
}

message GetManifestRequest {
    string  data_dir = 1;
    string  run_dir  = 2;
    uint32  module_id = 3;
}

message ManifestEntry {
    string  relative_path = 1;
    string  digest_hex    = 2;
    uint64  size_bytes    = 3;
    int64   mtime_ns      = 4;
}

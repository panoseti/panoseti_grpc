# ============================================================
# PANOSETI Unified gRPC Server — Headnode Profile
# Runs the telemetry service only.  DAQ nodes connect here
# for centralized log ingestion.
#
# Usage:
#   panoseti-server --profile headnode
#   panoseti-server --config /path/to/server_headnode.toml
# ============================================================

[server]
port = 50051
shutdown_grace_period = 5.0

[server.services]
telemetry   = true
daq_data    = false
daq_control = false
daq_data_v2 = true

# -------------------------------------------------------
# Telemetry service settings
# -------------------------------------------------------
[telemetry]
redis_host = "localhost"
redis_port = 6379
redis_db   = 0
shutdown_grace_period = 5.0
log_level  = "INFO"
# telemetry_config_path = ""  # leave empty to use the bundled device registry

# -------------------------------------------------------
# Daq Data v2 service settings
# -------------------------------------------------------
[daq_data_v2]
mode = "aggregator"
log_level = "INFO"

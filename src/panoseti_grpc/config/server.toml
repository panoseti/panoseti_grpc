# ============================================================
# PANOSETI Unified gRPC Server — Default Configuration
# All three services enabled; suitable for single-machine
# development / integration testing.
#
# Run with:
#   panoseti-server
#   panoseti-server --config /path/to/this/file
#   python -m panoseti_grpc
#
# For production deployments use the profile configs:
#   server_daq_node.toml   — daq_data + daq_control
#   server_headnode.toml   — telemetry only
# ============================================================

[server]
port = 50051
shutdown_grace_period = 5.0
log_dir = "/var/log/panoseti"
grpc_logging = true

[server.services]
# Telemetry MUST remain first in the unified boot order; it is the logging
# backend for all other services.  Set to false only when running telemetry
# on a separate machine (see server_daq_node.toml).
telemetry   = true
daq_data    = true
daq_control = true

# -------------------------------------------------------
# Telemetry service settings
# -------------------------------------------------------
[telemetry]
redis_host = "localhost"
redis_port = 6379
redis_db   = 0
# telemetry_config_path = ""  # leave empty to use the bundled device registry

# -------------------------------------------------------
# DAQ Data service settings
# -------------------------------------------------------
[daq_data]
init_from_default       = false
default_hp_io_config_file = "hp_io_config_simulate.json"
unix_domain_socket      = "unix:///tmp/daq_data.sock"
max_concurrent_rpcs     = 25
max_read_queue_size     = 100
min_hp_io_update_interval_seconds = 0.01
max_client_update_interval_seconds = 60.0
max_reader_enqueue_timeouts = 10
max_reader_dequeue_timeouts = 10
reader_timeout          = 60.0
shutdown_grace_period   = 5.0
hp_io_stop_timeout      = 10.0
valid_data_products     = ["img8", "img16", "ph256", "ph1024"]

[daq_data.acquisition_methods.uds]
enabled                 = true
data_products           = ["img8", "img16", "ph256", "ph1024"]
socket_path_template    = "/tmp/hashpipe_grpc.dp_{dp_name}.sock"
read_timeout            = 600.0

[daq_data.simulate_daq_cfg]
simulation_mode         = "uds"
sim_module_ids          = [224]
movie_type              = "img16"
ph_type                 = "ph256"

[daq_data.simulate_daq_cfg.source_data]
real_module_id = 1
movie_pff_path = "daq_data/simulated_data_dir/obs_Lick.start_2024-07-25T04:34:06Z.runtype_sci-data.pffd/start_2024-07-25T04_34_46Z.dp_img16.bpp_2.module_1.seqno_0.debug_TRUNCATED.pff"
ph_pff_path    = "daq_data/simulated_data_dir/obs_Lick.start_2024-07-25T04:34:06Z.runtype_sci-data.pffd/start_2024-07-25T04_34_46Z.dp_ph256.bpp_2.module_3.seqno_0.debug_TRUNCATED.pff"

[daq_data.simulate_daq_cfg.strategies.uds]
sim_module_ids = [224]
data_products = ["ph256", "img16"]

# -------------------------------------------------------
# DAQ Control service settings
# -------------------------------------------------------
[daq_control]
log_dir           = "/var/log/panoseti"
grpc_logging      = true
shutdown_grace_period = 5.0
log_level         = "INFO"

networks:
  panoseti-net:
    driver: bridge

services:
  loki:
    image: grafana/loki:3.6.0
    container_name: loki_logger
    # Run as root so `./loki-data` is always writable regardless of the host
    # directory's pre-existing ownership (isolation is not a concern here).
    # Switch to "10001:10001" (the image's default non-root user) once
    # ./loki-data is pre-chowned to that UID/GID on the host.
    user: "0:0"
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
#      - "-print-config-stderr"
    volumes:
      - ./loki-data:/loki
    networks:
      - panoseti-net
    restart: unless-stopped
    mem_limit: 4g


  # 2. Redis (The Buffer)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - panoseti-net

  # 3. Visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      # Point GRAFANA_PROVISIONING_DIR at your dashboards/datasources provisioning
      # directory (e.g. the panoseti repo's grafana/grafana_provisioning/).
      - ${GRAFANA_PROVISIONING_DIR:-./grafana_provisioning}:/etc/grafana/provisioning
    networks:
      - panoseti-net
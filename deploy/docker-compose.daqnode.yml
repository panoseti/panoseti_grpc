services:
  daqnode-server:
    image: pseti-daqnode:production
    build:
      # Context is grpc/ (not deploy/) so the Dockerfile can COPY the whole
      # package and install panoseti-grpc from local source -- pinned to
      # whatever commit is actually checked out here, not a PyPI release
      # that may lag behind (see Dockerfile.daqnode's install step).
      context: ..
      dockerfile: deploy/Dockerfile.daqnode
      args:
        LOCAL_UID: "${LOCAL_UID:-1000}"
        LOCAL_GID: "${LOCAL_GID:-1000}"
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - IPC_LOCK
      - SYS_NICE
    shm_size: '2gb'
    ulimits:
      memlock: -1   # unlimited pinned memory; pairs with IPC_LOCK for mlock'ed hashpipe databufs
      rtprio: 99     # allow SCHED_FIFO/RR; pairs with SYS_NICE for hashpipe thread priority
      nofile: 1048576
    # Optional: pin hashpipe threads to isolated cores once the host has `isolcpus` configured.
    # cpuset: "2-7"
    volumes:
      - ${DAQ_DATA_DIR:-/mnt/panoseti-test}/:${DAQ_DATA_DIR:-/mnt/panoseti-test}/
      # Mount the logs directory so it can be shipped via Alloy (or accessible bare metal)
      - /var/log/panoseti:/var/log/panoseti
    environment:
      HEADNODE_IP: "${HEADNODE_IP:-192.168.88.103}"
      # GRPC_PORT is a legacy fallback read by PanosetiServerConfig itself;
      # DAQNODE_GRPC_PORT is the canonical var, named explicitly via
      # `--port-env` below so it wins even over an explicit TOML port.
      GRPC_PORT: "${DAQNODE_GRPC_PORT:-50051}"
      # Was hardcoded to "50051" -- that silently ignored a non-default
      # HEADNODE_GRPC_PORT (e.g. the co-located single-machine setup, where
      # HEADNODE_GRPC_PORT and DAQNODE_GRPC_PORT must differ), breaking this
      # node's telemetry-log-shipping client and any daq_data gateway link
      # back to the head. Must stay env-driven like every other port here.
      HEADNODE_GRPC_PORT: "${HEADNODE_GRPC_PORT:-50051}"
      PSETI_LOGS: "/var/log/panoseti"
      DAQ_DATA_DIR: "${DAQ_DATA_DIR:-/mnt/panoseti-test}"
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
    # Overrides Dockerfile.daqnode's CMD (["--profile","daq_node"]) to also
    # name which env var reconfigures the bind port -- see
    # unified_main.py's resolve_bind_port().
    command: ["--profile", "daq_node", "--port-env", "DAQNODE_GRPC_PORT"]
    restart: always

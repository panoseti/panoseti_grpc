services:
  daqnode-server:
    image: pseti-daqnode:production
    build:
      context: .
      dockerfile: Dockerfile.daqnode
      args:
        LOCAL_UID: "${LOCAL_UID:-1000}"
        LOCAL_GID: "${LOCAL_GID:-1000}"
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - IPC_LOCK
      - SYS_NICE
    shm_size: '2gb'
    ulimits:
      memlock: -1   # unlimited pinned memory; pairs with IPC_LOCK for mlock'ed hashpipe databufs
      rtprio: 99     # allow SCHED_FIFO/RR; pairs with SYS_NICE for hashpipe thread priority
      nofile: 1048576
    # Optional: pin hashpipe threads to isolated cores once the host has `isolcpus` configured.
    # cpuset: "2-7"
    volumes:
      - ${DAQ_DATA_DIR:-/mnt/panoseti-test}/:${DAQ_DATA_DIR:-/mnt/panoseti-test}/
      # Mount the logs directory so it can be shipped via Alloy (or accessible bare metal)
      - /var/log/panoseti:/var/log/panoseti
    environment:
      HEADNODE_IP: "${HEADNODE_IP:-192.168.88.103}"
      GRPC_PORT: "50051"
      HEADNODE_GRPC_PORT: "50051"
      PSETI_LOGS: "/var/log/panoseti"
      DAQ_DATA_DIR: "${DAQ_DATA_DIR:-/mnt/panoseti-test}"
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
    restart: always

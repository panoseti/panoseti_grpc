services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=metadata
      - INFLUXDB_ADMIN_USER=root
      - INFLUXDB_ADMIN_PASSWORD=root

  # NEW: Add Loki for integration tests
  loki:
    image: grafana/loki:3.6.0
    user: "0:0"
    ports:
      - "3100:3100"
    # Mount config if necessary, or use defaults for testing
    command: -config.file=/etc/loki/local-config.yaml

  test_runner:
    build:
      context: ../../
      dockerfile: tests/telemetry/Dockerfile
    environment:
      - REDIS_HOST=redis
      - INFLUX_HOST=influxdb
      - LOKI_URL=http://loki:3100
      - GRPC_PORT=50051
      # Ensure client connects to the separate process started by conftest
      - HEADNODE_IP=localhost
    depends_on:
      - redis
      - influxdb
      - loki
    # Run integration first, then unit
    command: ["pytest", "--timeout=20", "-v", "tests/telemetry/integration", "tests/telemetry/unit"]
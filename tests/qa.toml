# ── Global settings ──────────────────────────────────────────────────────────

[settings]
default_parallel = 4
ignore = [
    "src/panoseti_grpc/ublox_control/"
]

# ── Lint tasks ───────────────────────────────────────────────────────────────
# All lint tasks run concurrently. Output lines are prefixed with the task name.

[lint.ruff]
command     = "docker build --target qa-linter -f Dockerfile.ci -t panoseti-qa-linter . && docker run --rm -v $(pwd):/app panoseti-qa-linter python -m ruff check src/ tests/ --fix"
description = "Ruff lint (Python) with autofix (src and tests)"

[lint.ruff_format]
command     = "docker run --rm -v $(pwd):/app panoseti-qa-linter python -m ruff format src/ tests/"
description = "Ruff format (src and tests)"

[lint.mypy]
command     = "docker run --rm -v $(pwd):/app panoseti-qa-linter python -m mypy src/ tests/ --exclude src/panoseti_grpc/ublox_control/"
description = "MyPy static type check (src and tests, excluding ublox_control)"

# ── Test tasks ────────────────────────────────────────────────────────────────
# Sequential execution.

[test.daq_data]
command     = "docker build -t panoseti-daq-data-ci --target daq-data-test -f Dockerfile.ci . && docker run --rm panoseti-daq-data-ci python3 -m pytest -v -s --maxfail=2 tests/daq_data/"
description = "DAQ Data service integration tests"

[test.daq_control]
command     = "docker compose -f tests/daq_control/docker-compose.test.yml up --build --exit-code-from test_runner --abort-on-container-exit && docker compose -f tests/daq_control/docker-compose.test.yml down"
description = "DAQ Control service integration tests"

[test.telemetry]
command     = "docker compose -f tests/telemetry/docker-compose.test.yml up --build --exit-code-from test_runner --abort-on-container-exit && docker compose -f tests/telemetry/docker-compose.test.yml down --volumes --remove-orphans"
description = "Telemetry service integration tests (requires Redis)"

[test.unified_server]
command     = "docker compose -f tests/unified_server/docker-compose.test.yml up --build --exit-code-from test_runner --abort-on-container-exit && docker compose -f tests/unified_server/docker-compose.test.yml down --volumes --remove-orphans"
description = "Unified server integration tests"

[test.hashpipe_daq_data]
command     = "docker build -t panoseti-hashpipe-daq-data-ci --target daq-data-hashpipe-test -f Dockerfile.ci . && docker run --rm --shm-size=2g -e RUN_REAL_DATA_TESTS=1 panoseti-hashpipe-daq-data-ci python3 -m pytest -v -s --maxfail=2 tests/daq_data_hashpipe/"
description = "Hashpipe DAQ Data integration tests (requires real/simulated hardware)"

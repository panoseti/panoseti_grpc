[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panoseti-grpc"
version = "0.4.1"
description = "gRPC for the PANOSETI project."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name="Nicolas Rault-Wang"},
    { name="Ben Godfrey"},
    { name="Wei Liu"}
]
license-files = [ "LICENSE" ]
keywords = [
    "panoseti", "gRPC", "observatory", "data-acquisition", "astronomy", "real-time"
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: Unix",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Framework :: AsyncIO",
]

dependencies = [
    "grpcio==1.78.0",
    "grpcio-tools==1.78.0",
    "grpcio-reflection==1.78.0",

    "protobuf>=6.31.1,<7.0.0",
    "coverage>=7.10.7",
    "cython",
    "wheel",
    "rich",
    "redis>=7",
    "snakeviz",
    "json5",
    "pyserial",
    "pyubx2",
    # "seaborn",
    # "matplotlib",
    "pandas",
    "numpy",
    "psutil",
    "aiofiles",
#    "pygnssutils",
    "pydantic>=2.12",
    "requests",
    "GitPython"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-timeout",
    "black",
    "flake8",
    "ipython",
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-autodoc-typehints",
]

[project.scripts]
panoseti-server      = "panoseti_grpc.unified_main:main"
pseti-cli            = "panoseti_grpc.cli:main"
panoseti-daq-data    = "panoseti_grpc.daq_data.server:main"
panoseti-daq-control = "panoseti_grpc.daq_control.server:main"
panoseti-telemetry   = "panoseti_grpc.telemetry.server:main"

[project.urls]
Homepage = "https://github.com/panoseti/panoseti_grpc"
Documentation = "https://github.com/panoseti/panoseti_grpc/blob/main/README.md"
Repository = "https://github.com/panoseti/panoseti_grpc"
Issues = "https://github.com/panoseti/panoseti_grpc/issues"

[tool.setuptools.packages.find]
where = ["src"]
#include = [
#    "panoseti_grpc/daq_data/*",
#    "ublox_control/*",
#    "generated/*",
#    "panoseti_util/*",
#]
exclude = ["*logs*", "*.pcapng", "*.png"]

# Include non-python data files:
[tool.setuptools.package-data]
"*" = ["*.json", "*.json5", "*.txt", "*.csv", "*.pff", "*.pffd", "*.toml"]
"panoseti_grpc.daq_data" = ["simulated_data_dir/**/*"]

[tool.setuptools]
include-package-data = true

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
asyncio_mode = "auto"
timeout = 120
testpaths = [
    "tests",
]


[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panoseti-grpc"
version = "0.5.0"
description = "gRPC for the PANOSETI project."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name="Nicolas Rault-Wang"},
    { name="Ben Godfrey"},
    { name="Wei Liu"}
]
license-files = [ "LICENSE" ]
keywords = [
    "panoseti", "gRPC", "observatory", "data-acquisition", "astronomy", "real-time"
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: Unix",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Framework :: AsyncIO",
]

dependencies = [
    "grpcio==1.78.0",
    "grpcio-tools==1.78.0",
    "grpcio-reflection==1.78.0",
    "protobuf>=6.31.1,<7.0.0",
    "grpcio-health-checking",
    "coverage>=7.10.7",
    "cython",
    "wheel",
    "rich",
    "redis>=7",
    "json5",
    "pyserial",
    "pyubx2",
    "pandas",
    "numpy",
    "psutil",
    "anyio",
    "pydantic>=2.12",
    "typer",
    "requests",
    "GitPython",
    "blake3",
    "testcontainers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-timeout",
    "ruff>=0.15",
    "mypy>=1.20.0",
    "mypy-protobuf",
    "types-protobuf",
    "ipython",
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-autodoc-typehints",
]

[project.scripts]
pseti-grpc           = "panoseti_grpc.cli:standalone_app"

[project.urls]
Homepage = "https://github.com/panoseti/panoseti_grpc"
Documentation = "https://github.com/panoseti/panoseti_grpc/blob/main/README.md"
Repository = "https://github.com/panoseti/panoseti_grpc"
Issues = "https://github.com/panoseti/panoseti_grpc/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*logs*", "*.pcapng", "*.png"]

# Include non-python data files:
[tool.setuptools.package-data]
"*" = ["*.json", "*.json5", "*.txt", "*.csv", "*.pff", "*.pffd", "*.toml"]
"panoseti_grpc.daq_data" = ["simulated_data_dir/**/*"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    "src/panoseti_grpc/generated",
    "src/panoseti_grpc/ublox_control",
    "**/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]
"tests/**/*" = ["E501"] # Allow long lines in tests (especially for data strings)
"src/panoseti_grpc/ublox_control/initialize/**/*" = ["E501"]
"src/panoseti_grpc/ublox_control/resources.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["src/panoseti_grpc/generated", "src/panoseti_grpc/ublox_control"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "panoseti_grpc.generated.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "panoseti_grpc.ublox_control.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
asyncio_mode = "auto"
timeout = 120
testpaths = [
    "tests",
]

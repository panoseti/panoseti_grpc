name: PSETI gRPC CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Concurrency group ensures that only the latest commit on a branch is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'

  # 1. Warm up the base cache.
  prepare-base:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Pre-build and Cache All Test Images
        run: |
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f docker-bake.hcl \
            --pull=false \
            --set *.cache-from=type=gha,scope=pseti-grpc-ci \
            --set *.cache-to=type=gha,mode=max,scope=pseti-grpc-ci

  # 2. Run All Tests
  test-suite:
    needs: prepare-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install host dependencies
        run: uv sync --all-extras

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run Full Test Suite via pseti-grpc CLI
        run: |
          # Use pseti-grpc CLI to run tests defined in tests/qa.toml
          # The CLI handles the docker bake/run orchestration internally
          PYTHONPATH=src uv run python3 -m panoseti_grpc.cli test all

  continuous-integration:
    name: Continuous-Integration Tests Must Pass
    runs-on: ubuntu-latest
    needs: [pre_job, prepare-base, test-suite]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.pre_job.outputs.should_skip }}" == "true" ]; then
            echo "Skipped duplicate run, marking as successful!"
          elif [ "${{ needs.test-suite.result }}" != "success" ]; then
            echo "Tests failed!"
            exit 1
          else
            echo "All checks passed!"
          fi
